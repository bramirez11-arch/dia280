<h1 class="Base head_one p1"><img id="img-1" src="images/Red_Wheelbarrow_Drawing.jpg" /></h1>
<h1 class="Base head_one">The Red Wheel Barrow</h1>
<h1 class="Base head_one Heading_3"><em class="span1">William Carlos Williams</em></h1>
<p class="Base Body p2">so much depends</p>
<stanza class="Base Body stanza">upon </stanza>
<p class="Base Body p3">a red wheel </p>
<stanza class="Base Body stanza">barrow</stanza>
<p class="Base Body p3">glazed with rain</p>
<stanza class="Base Body stanza">water</stanza>
<p class="Base Body p3">beside the white</p>
<stanza class="Base Body stanza">chickens</stanza>
